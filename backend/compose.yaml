services:
  app:
    build: .
    container_name: aaip-backend
    ports:
      - "8000:8000"

    env_file:
      - .env
    
    depends_on:
      - postgres
      - neo4j
      - qdrant
  
  postgres:
    image: postgres:17
    container_name: aaip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aaip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:2025
    container_name: aaip-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aaip-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
